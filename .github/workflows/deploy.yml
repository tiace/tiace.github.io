name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Clean build directories
        run: rm -rf .next out _site

      - run: deno install --allow-scripts
      - run: deno task build

      - name: Prepare site for GitHub Pages
        run: |
          mkdir -p _site

          find out -mindepth 1 -maxdepth 1 | while read -r item; do
            name=$(basename "$item")
            case "$name" in
              __next.*) continue ;;
            esac
            cp -r "$item" "_site/$name"
          done

          if [ -d _site/_next ]; then
            mv _site/_next _site/assets
          fi
          if [ -d _site/_not-found ]; then
            mv _site/_not-found _site/not-found
          fi

          rewrite() {
            find "$1" -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) \
              -exec sed -i 's|/_next/|/assets/|g; s|/_not-found/|/not-found/|g' {} +
          }

          for target in index.html 404.html assets not-found 404; do
            if [ -e "_site/$target" ]; then
              if [ -f "_site/$target" ]; then
                sed -i 's|/_next/|/assets/|g; s|/_not-found/|/not-found/|g' "_site/$target"
              else
                rewrite "_site/$target"
              fi
            fi
          done

          find out -mindepth 1 -maxdepth 1 -type d | while read -r dir; do
            name=$(basename "$dir")
            case "$name" in
              _next|_not-found|404) ;;
              *) [ -d "_site/$name" ] && rewrite "_site/$name" ;;
            esac
          done

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
