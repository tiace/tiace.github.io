name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno install --allow-scripts
      - run: deno task build

      - name: Copy build output to repository root
        run: |
          find out -mindepth 1 -maxdepth 1 | while read -r item; do
            name=$(basename "$item")
            rm -rf "$name"
            cp -r "$item" "./$name"
          done
          touch .nojekyll

      - name: Commit and push site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f .nojekyll
          find out -mindepth 1 -maxdepth 1 -exec basename {} \; | while read -r name; do
            git add -f "$name"
          done

          if git diff --staged --quiet; then
            echo "No site changes to deploy"
            exit 0
          fi

          git commit -m "Deploy site to GitHub Pages root [skip ci]"
          git push
